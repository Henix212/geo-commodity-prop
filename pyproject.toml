[project]
name = "geo-commodity-prop"
version = "0.1.0"
description = "GNN for shock propagation along physical commodity supply chains"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch",
    "torch-geometric",
    "networkx",
    "pandas",
    "numpy",
    "transformers",
    "requests",
    "beautifulsoup4",
    "yfinance",
    "vectorbt",
    "plotly>=5.18,<6",
    "pyyaml",
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.10.9",
    "accelerate>=1.15.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
geo-commodity = "geo_commodity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geo_commodity", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

# Force CUDA torch (RTX 50-series / Windows) — avoid PyPI CPU wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
