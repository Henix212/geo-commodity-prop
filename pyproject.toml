[project]
name = "geo-commodity-prop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch-geometric",
    "networkx",
    "pandas",
    "numpy",
    "transformers",
    "requests",
    "beautifulsoup4",
    "yfinance",
    "vectorbt",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project.scripts]
geo-commodity = "backend.main:main"
