[project]
name = "geo-commodity-prop"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch-geometric",
    "networkx",
    "pandas",
    "numpy",
    "transformers",
    "requests",
    "beautifulsoup4",
    "yfinance",
    "vectorbt",
    "pyyaml",
    "huggingface-hub>=1.31.0",
    "matplotlib>=3.10.9",
    "accelerate>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[project.scripts]
geo-commodity = "backend.main:main"

# Force CUDA torch (RTX 50-series / Windows) — avoid PyPI CPU wheel.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
